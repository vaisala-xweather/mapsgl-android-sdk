plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Mapbox and Xweather credentials come from local.properties (untracked), never from source control.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def credential = { String key ->
    def value = localProperties.getProperty(key, '')
    if (value.isEmpty()) {
        logger.warn("local.properties has no '$key'; the demo cannot load maps or weather data without it.")
    }
    return value
}

android {
    namespace "com.example.mapsgldemo"
    compileSdk 36
    ndkVersion "27.1.12297006"
    
    defaultConfig {
        applicationId "com.example.mapsgldemoapp"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "v1.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        resValue "string", "mapbox_access_token", credential('mapbox.accessToken')
        resValue "string", "xweather_client_id", credential('xweather.clientId')
        resValue "string", "xweather_client_secret", credential('xweather.clientSecret')
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        // Instrumentable twin of `release`: same R8 pipeline and the same app proguard rules,
        // plus the few keeps AndroidJUnitRunner needs to start. Exists so the smoke test can run
        // against a minified build without those test-only keeps leaking into the shipped APK.
        minifiedTest {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro',
                    'proguard-rules-instrumentation.pro'
        }
    }

    // Instrumentation runs against the minified variant -- that is the point of the exercise.
    testBuildType = "minifiedTest"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures.viewBinding = true
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.navigation:navigation-compose:2.9.6'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation "com.mapbox.maps:android-ndk27:11.15.3"
    implementation 'com.github.vaisala-xweather:mapsgl-android-sdk:v1.8.0'

    // The template ExampleUnitTest/ExampleInstrumentedTest shipped without these, so neither
    // compiled. AllActivitiesSmokeTest needs androidx.test to drive activities in-process:
    // the demo's activities are not exported, so `adb shell am start` cannot reach them.

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}