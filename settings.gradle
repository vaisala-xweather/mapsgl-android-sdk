pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Credentials live in local.properties (untracked) or ~/.gradle/gradle.properties, never in this repo.
def localProperties = new Properties()
def localPropertiesFile = new File(settingsDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def mapboxDownloadsToken = providers.gradleProperty('MAPBOX_DOWNLOADS_TOKEN')
        .getOrElse(localProperties.getProperty('MAPBOX_DOWNLOADS_TOKEN', ''))

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            metadataSources {
                mavenPom()
                artifact()
            }
        }
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                // Your secret Mapbox downloads token, set as MAPBOX_DOWNLOADS_TOKEN in local.properties
                password = mapboxDownloadsToken
            }
        }
    }
}

rootProject.name = "MapsGL v1.8.0"
include ':app'
